name: Android checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  verify:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require promotion from develop
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: test "$SOURCE_BRANCH" = develop && test "$SOURCE_REPO" = "$TARGET_REPO"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
  device-test:
    name: Android device test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: bash ./gradlew connectedDebugAndroidTest --no-daemon
